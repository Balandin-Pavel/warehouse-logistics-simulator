name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore WarehouseLogistics.slnx

      - name: Build
        run: dotnet build WarehouseLogistics.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test WarehouseLogistics.slnx --no-build --no-restore --configuration Release
